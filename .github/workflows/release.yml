name: Release

# ADR 0020 makes GitHub Actions the deployment control plane: Railway service
# autodeploys stay disabled, and this serialized job orchestrates the release
# after Quality passes on `main`. It runs in the protected `production`
# environment, whose Project Owner approval releases its least-privilege
# secrets for this run only. No credential is returned to the owner session.
#
# ADR 0038 fixes the order: database, then API, then the worker heartbeat, then
# the Caddy-hosted browser client, then the deployed smoke journey. A failed
# stage stops every later one.

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The current release finishes without preemption; the next one waits.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.0.0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      APP_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEPLOYMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marketplace/backend build
      - run: npm install --global @railway/cli

      # Database first. Migrations are expand-and-contract (ADR 0021) and are
      # never automatically reversed (ADR 0038), so this runs before any
      # service moves to the new release.
      - name: Migrate the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      # The API next, holding the previous client contract during rollout.
      # Railway's healthcheck is `/health/ready`, so this step does not return
      # until the API has proven PostgreSQL access and schema compatibility.
      - name: Deploy the API
        run: |
          railway variables --service api --set "APP_RELEASE=$APP_RELEASE" --skip-deploys
          railway up --service api --ci

      # Then the worker, which writes its heartbeat as it starts.
      - name: Deploy the worker
        run: |
          railway variables --service worker --set "APP_RELEASE=$APP_RELEASE" --skip-deploys
          railway up --service worker --ci

      # The gate ADR 0038 puts between the API and the browser client. The
      # worker speaks no HTTP, so this reads the heartbeat where the worker
      # writes it, and requires one carrying this release rather than the last.
      - name: Await the worker heartbeat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @marketplace/backend release:worker-gate

      # The browser client last, behind the single public origin of ADR 0028.
      - name: Deploy the browser client
        run: |
          railway variables --service web --set "APP_RELEASE=$APP_RELEASE" --skip-deploys
          railway up --service web --ci

      # The deployed smoke journey: authentication, Interface Locale, Class
      # Session Discovery, Booking, Student Cancellation, and the Audit
      # Entries those mutations leave behind, as a shared reviewer identity.
      - name: Run the deployed smoke journey
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          SMOKE_CLIENT_ID: ${{ secrets.SMOKE_CLIENT_ID }}
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
          SMOKE_STUDENT_USERNAME: ${{ secrets.SMOKE_STUDENT_USERNAME }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
          SMOKE_ADMINISTRATOR_USERNAME: ${{ secrets.SMOKE_ADMINISTRATOR_USERNAME }}
          SMOKE_ADMINISTRATOR_PASSWORD: ${{ secrets.SMOKE_ADMINISTRATOR_PASSWORD }}
        run: pnpm --filter @marketplace/backend release:smoke
