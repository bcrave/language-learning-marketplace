query StudentWorkspace {
  studentWorkspace {
    user {
      id
      displayName
      interfaceLocale
      displayTimeZone
    }
    roles
  }
}

mutation SaveUserPreferences($input: SaveUserPreferencesInput!) {
  saveUserPreferences(input: $input) {
    user {
      id
      displayName
      interfaceLocale
      displayTimeZone
    }
  }
}
