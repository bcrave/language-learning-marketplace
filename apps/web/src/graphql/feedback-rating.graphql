query TeacherFeedbackWork {
  teacherFeedbackWork { bookingId classSessionId feedbackDeadline studentDisplayName learningFeedback { bookingId observedStrengths suggestedFocuses observations nextPractice state submittedAt redactedAt redactionReason updatedAt } }
}
mutation SaveLearningFeedback($input: SaveLearningFeedbackInput!) {
  saveLearningFeedback(input: $input) { __typename ... on SaveLearningFeedbackSuccess { feedback { bookingId observedStrengths suggestedFocuses observations nextPractice state submittedAt redactedAt redactionReason updatedAt } } ... on LearningFeedbackError { code message } }
}
query StudentFeedbackAndRatings {
  studentFeedbackAndRatings { bookingId classSessionId classSessionEndsAt feedbackDeadline ratingDeadline teacherDisplayName learningFeedback { bookingId observedStrengths suggestedFocuses observations nextPractice state submittedAt redactedAt redactionReason updatedAt } sessionRating { bookingId overallRating positiveTags improvementTags comment redactedAt redactionReason createdAt updatedAt } }
}
mutation SaveSessionRating($input: SaveSessionRatingInput!) {
  saveSessionRating(input: $input) { __typename ... on SaveSessionRatingSuccess { rating { bookingId overallRating positiveTags improvementTags comment redactedAt redactionReason createdAt updatedAt } } ... on SessionRatingError { code message } }
}
query AdministratorFeedbackAndRatings {
  administratorFeedbackAndRatings { bookingId classSessionId studentDisplayName teacherDisplayName learningFeedback { state observedStrengths suggestedFocuses observations nextPractice redactedAt redactionReason updatedAt } sessionRating { overallRating positiveTags improvementTags comment redactedAt redactionReason updatedAt } }
}
mutation RedactLearningFeedback($input: RedactLearningFeedbackInput!) {
  redactLearningFeedback(input: $input) { __typename ... on RedactLearningFeedbackSuccess { feedback { bookingId redactedAt redactionReason } } ... on LearningFeedbackError { code message } }
}
mutation RedactSessionRatingComment($input: RedactSessionRatingCommentInput!) {
  redactSessionRatingComment(input: $input) { __typename ... on RedactSessionRatingCommentSuccess { rating { bookingId redactedAt redactionReason } } ... on SessionRatingError { code message } }
}
