query MarketplaceOperationalReport($input: MarketplaceOperationalReportInput) {
  marketplaceOperationalReport(input: $input) {
    generatedAt
    range {
      fromLocalDate
      toLocalDate
      timeZone
    }
    attendance {
      attendedCount
      noShowCount
      recordedCount
      attendanceRatePercentage
      excludedUnrecordedCount
      correctedCount
      exceptionCount
    }
    cancellations {
      studentCancellationCount
      timelyCount
      lateCount
      studentCancellationRatePercentage
      excludedClassSessionCancellationCount
      excludedRescheduleCount
      dailyRates {
        localDate
        studentCancellationCount
        timelyCount
        lateCount
        recordedOutcomeCount
        excludedUnrecordedCount
        studentCancellationRatePercentage
      }
    }
    corrections {
      correctedAttendanceCount
      lastCorrectedAt
      pendingAttendanceReviewCount
    }
    credits {
      creditAdjustmentCount
      grantedCreditCount
      refundedCreditCount
      deductedCreditCount
      netCreditChange
      bySource {
        source
        entryCount
        netAmount
      }
    }
    courseProgress {
      courseId
      courseTitle
      targetLanguage
      curriculumLevel
      activeLessonUnitCount
      completedActiveLessonUnitCount
      studentsWithProgressCount
    }
    actionableExceptions {
      totalCount
      items {
        kind
        classSessionId
        occurredAt
        courseTitle
        lessonUnitTitle
        teacherDisplayName
        affectedBookingCount
      }
    }
  }
}
