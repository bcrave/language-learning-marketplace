query RoleAssignmentAdministration {
  roleAssignmentAdministration {
    organizations { id name }
    users {
      id
      displayName
      accessStatus
      suspensionReason
      roles
      roleAssignmentHistory { id role action reason changedAt }
    }
  }
}

mutation GrantRoleAssignment($input: ChangeRoleAssignmentInput!) {
  grantRoleAssignment(input: $input) {
    ... on RoleAssignmentChangeSuccess {
      user { id displayName accessStatus suspensionReason roles roleAssignmentHistory { id role action reason changedAt } }
      endedBookingCount
      removedWaitlistEntryCount
      refundedClassCreditCount
      subscriptionEnded
      sponsorshipEnded
    }
    ... on RoleAssignmentError { code message classSessionIds }
  }
}

mutation RemoveRoleAssignment($input: ChangeRoleAssignmentInput!) {
  removeRoleAssignment(input: $input) {
    ... on RoleAssignmentChangeSuccess {
      user { id displayName accessStatus suspensionReason roles roleAssignmentHistory { id role action reason changedAt } }
      endedBookingCount
      removedWaitlistEntryCount
      refundedClassCreditCount
      subscriptionEnded
      sponsorshipEnded
    }
    ... on RoleAssignmentError { code message classSessionIds }
  }
}

mutation SuspendUser($input: ChangeUserAccessInput!) {
  suspendUser(input: $input) {
    ... on UserAccessChangeSuccess {
      user { id displayName accessStatus suspensionReason roles roleAssignmentHistory { id role action reason changedAt } }
      endedBookingCount
      removedWaitlistEntryCount
      refundedClassCreditCount
      teacherClassSessionIds
    }
    ... on UserAccessError { code message }
  }
}

mutation ReactivateUser($input: ReactivateUserInput!) {
  reactivateUser(input: $input) {
    ... on UserAccessChangeSuccess {
      user { id displayName accessStatus suspensionReason roles roleAssignmentHistory { id role action reason changedAt } }
      endedBookingCount
      removedWaitlistEntryCount
      refundedClassCreditCount
      teacherClassSessionIds
    }
    ... on UserAccessError { code message }
  }
}
