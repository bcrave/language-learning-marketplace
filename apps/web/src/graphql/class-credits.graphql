query StudentClassCredits {
  studentClassCredits {
    studentUserId
    availableBalance
    ledger {
      id
      amount
      source
      sourceReference
      reason
      createdAt
    }
  }
}

query AdministrationClassCredits($studentUserId: ID!) {
  administrationClassCredits(studentUserId: $studentUserId) {
    studentUserId
    availableBalance
    ledger {
      id
      amount
      source
      sourceReference
      reason
      createdAt
    }
  }
}

mutation AdjustClassCredits($input: AdjustClassCreditsInput!) {
  adjustClassCredits(input: $input) {
    ... on AdjustClassCreditsSuccess {
      account {
        studentUserId
        availableBalance
        ledger {
          id
          amount
          source
          sourceReference
          reason
          createdAt
        }
      }
    }
    ... on ClassCreditAdjustmentError {
      code
      message
    }
    ... on CurriculumConflict {
      conflictCode: code
      message
    }
  }
}

query StudentSubscription {
  studentSubscription {
    id
    state
    anchorDay
    accountingTimeUtc
    activatedAt
    nextAnniversaryAt
    cancellationEffectiveAt
  }
}

mutation ScheduleSubscriptionCancellation($input: SubscriptionLifecycleInput!) {
  scheduleSubscriptionCancellation(input: $input) {
    ... on ScheduleSubscriptionCancellationSuccess {
      subscription {
        id
        state
        anchorDay
        accountingTimeUtc
        activatedAt
        nextAnniversaryAt
        cancellationEffectiveAt
      }
    }
    ... on SubscriptionConflict { code message }
  }
}

mutation UndoSubscriptionCancellation($input: SubscriptionLifecycleInput!) {
  undoSubscriptionCancellation(input: $input) {
    ... on UndoSubscriptionCancellationSuccess {
      subscription {
        id
        state
        anchorDay
        accountingTimeUtc
        activatedAt
        nextAnniversaryAt
        cancellationEffectiveAt
      }
    }
    ... on SubscriptionConflict { code message }
  }
}
