enum InterfaceLocale {
  EN
  ES
}

enum UserRole {
  STUDENT
  TEACHER
  ORGANIZATION_MANAGER
  PLATFORM_ADMINISTRATOR
}

enum WorkspacePlace {
  STUDENT_DISCOVERY
  STUDENT_LEARNING
  TEACHER_SCHEDULE
  TEACHER_AVAILABILITY
  ORGANIZATION_STUDENTS
  ORGANIZATION_REPORTS
  ADMINISTRATION_OPERATIONS
  ADMINISTRATION_PEOPLE
}

enum WorkspaceRelationshipScope {
  SELF
  ASSIGNED_CLASS_SESSIONS
  ASSIGNED_ORGANIZATION
  MARKETPLACE_WIDE
}

enum CurriculumLevel { A1 A2 B1 B2 C1 C2 }
enum LessonUnitState { ACTIVE RETIRED }
enum LessonMaterialKind { STRUCTURED_TEXT HTTPS_REFERENCE }
enum Weekday { MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY SUNDAY }
enum LocalTimeDisambiguation { REJECT EARLIER LATER }

enum ClassCreditLedgerSource { CREDIT_ADJUSTMENT SUBSCRIPTION_GRANT ORGANIZATION_CREDIT_GRANT BOOKING_DEDUCTION BOOKING_REFUND }
type ClassCreditLedgerEntry { id: ID!, amount: Int!, source: ClassCreditLedgerSource!, sourceReference: String!, reason: String, createdAt: String! }
type ClassCreditAccount { studentUserId: ID!, availableBalance: Int!, ledger: [ClassCreditLedgerEntry!]! }
input AdjustClassCreditsInput { idempotencyKey: ID!, studentUserId: ID!, amount: Int!, reason: String! }
type AdjustClassCreditsSuccess { account: ClassCreditAccount! }
enum ClassCreditAdjustmentErrorCode { INVALID_ADJUSTMENT INVALID_REASON STUDENT_NOT_FOUND INSUFFICIENT_CLASS_CREDITS }
type ClassCreditAdjustmentError { code: ClassCreditAdjustmentErrorCode!, message: String! }
union AdjustClassCreditsResult = AdjustClassCreditsSuccess | ClassCreditAdjustmentError | CurriculumConflict

enum SubscriptionState { ACTIVE CANCELLATION_SCHEDULED CANCELLED }
enum SubscriptionProviderEventType { ACTIVATED RENEWED CANCELLED REACTIVATED }
type Subscription { id: ID!, studentUserId: ID!, state: SubscriptionState!, anchorDay: Int!, accountingTimeUtc: String!, activatedAt: String!, nextAnniversaryAt: String, cancellationEffectiveAt: String }
input ProcessSubscriptionProviderEventInput { idempotencyKey: ID!, providerEventId: ID!, studentUserId: ID!, eventType: SubscriptionProviderEventType!, effectiveAt: String!, reason: String! }
input SubscriptionLifecycleInput { idempotencyKey: ID! }
type ProcessSubscriptionProviderEventSuccess { subscription: Subscription!, account: ClassCreditAccount! }
type ScheduleSubscriptionCancellationSuccess { subscription: Subscription! }
type UndoSubscriptionCancellationSuccess { subscription: Subscription! }
type SubscriptionConflict { code: String!, message: String! }
union ProcessSubscriptionProviderEventResult = ProcessSubscriptionProviderEventSuccess | SubscriptionConflict
union ScheduleSubscriptionCancellationResult = ScheduleSubscriptionCancellationSuccess | SubscriptionConflict
union UndoSubscriptionCancellationResult = UndoSubscriptionCancellationSuccess | SubscriptionConflict

enum ClassSessionState { PUBLISHED CANCELLED }
type ClassSession { id: ID!, lessonUnitId: ID!, teacherUserId: ID!, startsAt: String!, endsAt: String!, schedulingTimeZone: String!, seatCapacity: Int!, occupiedSeats: Int!, state: ClassSessionState!, cancellationReason: String }
enum BookingState { ACTIVE ENDED }
enum BookingTerminalReason { STUDENT_CANCELLATION RESCHEDULED CLASS_SESSION_CANCELLATION }
type Booking { id: ID!, state: BookingState!, terminalReason: BookingTerminalReason, classCreditRefunded: Boolean!, bookedAt: String!, endedAt: String, classSession: ClassSession! }
input BookClassSessionInput { idempotencyKey: ID!, classSessionId: ID! }
input CancelBookingInput { idempotencyKey: ID!, bookingId: ID! }
input RescheduleBookingInput { idempotencyKey: ID!, bookingId: ID!, replacementClassSessionId: ID! }
type BookClassSessionSuccess { booking: Booking!, account: ClassCreditAccount! }
type CancelBookingSuccess { booking: Booking!, account: ClassCreditAccount! }
type RescheduleBookingSuccess { originalBooking: Booking!, replacementBooking: Booking!, account: ClassCreditAccount! }
enum BookingErrorCode { CLASS_SESSION_NOT_FOUND BOOKING_WINDOW_CLOSED SESSION_FULL INSUFFICIENT_CLASS_CREDITS SCHEDULE_CONFLICT ALREADY_BOOKED BOOKING_NOT_FOUND BOOKING_NOT_ACTIVE CANCELLATION_WINDOW_CLOSED LESSON_UNIT_MISMATCH IDEMPOTENCY_KEY_REUSED }
type BookingError { code: BookingErrorCode!, message: String! }
union BookClassSessionResult = BookClassSessionSuccess | BookingError
union CancelBookingResult = CancelBookingSuccess | BookingError
union RescheduleBookingResult = RescheduleBookingSuccess | BookingError
enum WaitlistEntryState { ACTIVE WITHDRAWN PROMOTED EXPIRED INELIGIBLE }
enum WaitlistTerminalReason { WITHDRAWN PROMOTED EXPIRED CLASS_SESSION_UNAVAILABLE INSUFFICIENT_CLASS_CREDITS SCHEDULE_CONFLICT ALREADY_BOOKED }
type WaitlistEntry { id: ID!, state: WaitlistEntryState!, terminalReason: WaitlistTerminalReason, joinedAt: String!, expiresAt: String!, completedAt: String, classSession: ClassSession!, resultingBooking: Booking }
input JoinWaitlistInput { idempotencyKey: ID!, classSessionId: ID! }
input WithdrawWaitlistInput { idempotencyKey: ID!, waitlistEntryId: ID! }
type JoinWaitlistSuccess { entry: WaitlistEntry! }
type WithdrawWaitlistSuccess { entry: WaitlistEntry! }
type WaitlistPromotionWon { booking: Booking! }
enum WaitlistErrorCode { CLASS_SESSION_NOT_FOUND WAITLIST_NOT_OPEN SESSION_NOT_FULL INSUFFICIENT_CLASS_CREDITS SCHEDULE_CONFLICT ALREADY_BOOKED ALREADY_WAITLISTED WAITLIST_ENTRY_NOT_FOUND WAITLIST_ENTRY_NOT_ACTIVE IDEMPOTENCY_KEY_REUSED }
type WaitlistError { code: WaitlistErrorCode!, message: String! }
union JoinWaitlistResult = JoinWaitlistSuccess | WaitlistError
union WithdrawWaitlistResult = WithdrawWaitlistSuccess | WaitlistPromotionWon | WaitlistError
input PublishClassSessionInput { idempotencyKey: ID!, lessonUnitId: ID!, teacherUserId: ID!, startsAtLocal: String!, schedulingTimeZone: String!, timeDisambiguation: LocalTimeDisambiguation!, seatCapacity: Int = 5 }
type PublishClassSessionSuccess { classSession: ClassSession! }
enum ClassSessionPublicationErrorCode { INVALID_SEAT_CAPACITY INVALID_SCHEDULING_TIME_ZONE LOCAL_TIME_FOLD LOCAL_TIME_GAP INVALID_LOCAL_DATE_TIME INVALID_LESSON_UNIT TEACHER_QUALIFICATION_REQUIRED TEACHER_AVAILABILITY_REQUIRED AVAILABILITY_EXCEPTION_CONFLICT TEACHER_SCHEDULE_CONFLICT }
type ClassSessionPublicationError { code: ClassSessionPublicationErrorCode!, message: String! }
union PublishClassSessionResult = PublishClassSessionSuccess | ClassSessionPublicationError | CurriculumConflict
input ChangeClassSessionSeatCapacityInput { idempotencyKey: ID!, classSessionId: ID!, seatCapacity: Int! }
type ChangeClassSessionSeatCapacitySuccess { classSession: ClassSession! }
enum ClassSessionSeatCapacityErrorCode { INVALID_SEAT_CAPACITY CLASS_SESSION_NOT_FOUND SEAT_CAPACITY_BELOW_OCCUPIED_SEATS }
type ClassSessionSeatCapacityError { code: ClassSessionSeatCapacityErrorCode!, message: String! }
union ChangeClassSessionSeatCapacityResult = ChangeClassSessionSeatCapacitySuccess | ClassSessionSeatCapacityError | CurriculumConflict
enum AbsenceRequestState { OPEN RESOLVED }
type AbsenceRequest { id: ID!, state: AbsenceRequestState!, requestedAt: String!, classSessions: [ClassSession!]! }
input ReportAbsenceInput { idempotencyKey: ID!, classSessionIds: [ID!]! }
type ReportAbsenceSuccess { absenceRequest: AbsenceRequest! }
input SubstituteTeacherInput { idempotencyKey: ID!, absenceRequestId: ID!, classSessionId: ID!, replacementTeacherUserId: ID! }
type SubstituteTeacherSuccess { classSession: ClassSession!, absenceRequest: AbsenceRequest! }
input CancelClassSessionInput { idempotencyKey: ID!, absenceRequestId: ID!, classSessionId: ID!, reason: String! }
type CancelClassSessionSuccess { classSession: ClassSession!, absenceRequest: AbsenceRequest!, refundedBookingCount: Int!, removedWaitlistEntryCount: Int! }
enum ClassSessionDisruptionErrorCode { INVALID_CLASS_SESSIONS INVALID_REASON CLASS_SESSION_NOT_FOUND CLASS_SESSION_NOT_ASSIGNED ABSENCE_ALREADY_REPORTED ABSENCE_REQUEST_NOT_FOUND DISRUPTION_ALREADY_RESOLVED CLASS_SESSION_ALREADY_STARTED REPLACEMENT_TEACHER_REQUIRED TEACHER_QUALIFICATION_REQUIRED TEACHER_SCHEDULE_CONFLICT ATTENDANCE_ALREADY_SUBMITTED IDEMPOTENCY_KEY_REUSED }
type ClassSessionDisruptionError { code: ClassSessionDisruptionErrorCode!, message: String! }
union ReportAbsenceResult = ReportAbsenceSuccess | ClassSessionDisruptionError
union SubstituteTeacherResult = SubstituteTeacherSuccess | ClassSessionDisruptionError
union CancelClassSessionResult = CancelClassSessionSuccess | ClassSessionDisruptionError

type TeacherAvailabilityRange { id: ID!, weekday: Weekday!, startLocalTime: String!, endLocalTime: String!, effectiveFrom: String!, effectiveUntil: String, timeZone: String! }
type AvailabilityException { id: ID!, startsAtLocal: String!, endsAtLocal: String!, startsAt: String!, endsAt: String!, timeZone: String! }
type TeacherAvailability { timeZone: String!, weeklyRanges: [TeacherAvailabilityRange!]!, exceptions: [AvailabilityException!]! }
type TeacherAvailabilityOccurrence { rangeId: ID!, localDate: String!, startLocalTime: String!, endLocalTime: String!, startsAt: String!, endsAt: String! }
input SaveTeacherAvailabilityRangeInput { idempotencyKey: ID!, weekday: Weekday!, startLocalTime: String!, endLocalTime: String!, effectiveFrom: String!, timeZone: String! }
input AddAvailabilityExceptionInput { idempotencyKey: ID!, startsAtLocal: String!, endsAtLocal: String!, startDisambiguation: LocalTimeDisambiguation!, endDisambiguation: LocalTimeDisambiguation! }
input EndTeacherAvailabilityRangeInput { idempotencyKey: ID!, rangeId: ID!, effectiveUntil: String! }
input RemoveAvailabilityExceptionInput { idempotencyKey: ID!, exceptionId: ID! }
type SaveTeacherAvailabilityRangeSuccess { range: TeacherAvailabilityRange! }
type AddAvailabilityExceptionSuccess { exception: AvailabilityException! }
type EndTeacherAvailabilityRangeSuccess { range: TeacherAvailabilityRange! }
type RemoveAvailabilityExceptionSuccess { exceptionId: ID! }
type TeacherAvailabilityValidationError { code: String!, message: String! }
type AvailabilityExceptionSessionConflict { code: String!, message: String!, classSessionIds: [ID!]!, absenceRequestPath: String! }
union SaveTeacherAvailabilityRangeResult = SaveTeacherAvailabilityRangeSuccess | TeacherAvailabilityValidationError
union AddAvailabilityExceptionResult = AddAvailabilityExceptionSuccess | TeacherAvailabilityValidationError | AvailabilityExceptionSessionConflict
union EndTeacherAvailabilityRangeResult = EndTeacherAvailabilityRangeSuccess | TeacherAvailabilityValidationError
union RemoveAvailabilityExceptionResult = RemoveAvailabilityExceptionSuccess | TeacherAvailabilityValidationError

type Topic { key: String!, label: String!, labelEn: String!, labelEs: String! }
type Course { id: ID!, key: String!, targetLanguage: String!, curriculumLevel: CurriculumLevel!, title: String!, summary: String!, lessonUnits: [LessonUnit!]! }
type LessonUnit { id: ID!, key: String!, courseId: ID!, title: String!, summary: String!, objectives: [String!]!, order: Int!, state: LessonUnitState!, topics: [Topic!]!, materials: [LessonMaterial!]! }
type LessonMaterial { id: ID!, kind: LessonMaterialKind!, title: String!, structuredContent: String, httpsUrl: String, publisher: String }
type TeacherQualification { targetLanguage: String!, curriculumLevel: CurriculumLevel! }
type PublicTeacherProfile { id: ID!, displayName: String!, pronouns: String, profileImageUrl: String, professionalBiography: String!, taughtLanguages: [String!]!, qualifiedCurriculumLevels: [CurriculumLevel!]!, teachingTopics: [Topic!]!, completedSessionCount: Int! }
type AdministrationCurriculum { courses: [Course!]!, topics: [Topic!]!, teachers: [PublicTeacherProfile!]! }

input CreateCourseInput { idempotencyKey: ID!, targetLanguage: String!, curriculumLevel: CurriculumLevel!, title: String!, summary: String! }
input UpdateCourseInput { courseId: ID!, title: String!, summary: String! }
input CreateLessonUnitInput { idempotencyKey: ID!, courseId: ID!, title: String!, summary: String!, objectives: [String!]!, topicKeys: [String!]! }
input UpdateLessonUnitInput { lessonUnitId: ID!, title: String!, summary: String!, objectives: [String!]!, topicKeys: [String!]! }
input ReorderLessonUnitInput { lessonUnitId: ID!, order: Int! }
input RetireLessonUnitInput { idempotencyKey: ID!, lessonUnitId: ID!, replacementLessonUnitId: ID }
input UpsertTopicInput { idempotencyKey: ID!, key: String!, labelEn: String!, labelEs: String! }
input StructuredTextBlockInput { type: String!, text: String, items: [String!], level: Int }
input AddLessonMaterialInput { idempotencyKey: ID!, lessonUnitId: ID!, kind: LessonMaterialKind!, title: String!, structuredContent: [StructuredTextBlockInput!], httpsUrl: String, publisher: String }
input ReviseLessonMaterialInput { idempotencyKey: ID!, materialId: ID!, kind: LessonMaterialKind!, title: String!, structuredContent: [StructuredTextBlockInput!], httpsUrl: String, publisher: String }
input SaveTeacherProfileInput { idempotencyKey: ID!, teacherUserId: ID!, pronouns: String, profileImageUrl: String, professionalBiography: String!, topicKeys: [String!]! }
input ChangeTeacherQualificationInput { idempotencyKey: ID!, teacherUserId: ID!, targetLanguage: String!, curriculumLevel: CurriculumLevel! }

type CurriculumConflict { code: String!, message: String! }
type InvalidLessonMaterial { code: String!, message: String! }
type InstructionalIdentityLocked { code: String!, lessonUnitId: ID! }
type TeacherQualificationRemovalBlocked { code: String!, classSessionIds: [ID!]! }
type CreateCourseSuccess { course: Course! }
type UpdateCourseSuccess { course: Course! }
type CreateLessonUnitSuccess { lessonUnit: LessonUnit! }
type UpdateLessonUnitSuccess { lessonUnit: LessonUnit! }
type ReorderLessonUnitSuccess { lessonUnit: LessonUnit! }
type RetireLessonUnitSuccess { lessonUnit: LessonUnit! }
type UpsertTopicSuccess { topic: Topic! }
type AddLessonMaterialSuccess { material: LessonMaterial! }
type ReviseLessonMaterialSuccess { material: LessonMaterial! }
type SaveTeacherProfileSuccess { teacherProfile: PublicTeacherProfile! }
type ChangeTeacherQualificationSuccess { teacherProfile: PublicTeacherProfile! }
union CreateCourseResult = CreateCourseSuccess | CurriculumConflict
union UpdateCourseResult = UpdateCourseSuccess | CurriculumConflict
union CreateLessonUnitResult = CreateLessonUnitSuccess | CurriculumConflict
union UpdateLessonUnitResult = UpdateLessonUnitSuccess | InstructionalIdentityLocked | CurriculumConflict
union ReorderLessonUnitResult = ReorderLessonUnitSuccess | CurriculumConflict
union RetireLessonUnitResult = RetireLessonUnitSuccess | CurriculumConflict
union AddLessonMaterialResult = AddLessonMaterialSuccess | InvalidLessonMaterial | CurriculumConflict
union ReviseLessonMaterialResult = ReviseLessonMaterialSuccess | InvalidLessonMaterial | CurriculumConflict
union GrantTeacherQualificationResult = ChangeTeacherQualificationSuccess | CurriculumConflict
union RemoveTeacherQualificationResult = ChangeTeacherQualificationSuccess | TeacherQualificationRemovalBlocked | CurriculumConflict

type User {
  id: ID!
  displayName: String!
  interfaceLocale: InterfaceLocale
  displayTimeZone: String
}

input SaveUserPreferencesInput {
  actingRole: UserRole!
  interfaceLocale: InterfaceLocale!
  displayTimeZone: String!
}

input RememberRoleWorkspacePlaceInput {
  actingRole: UserRole!
  place: WorkspacePlace!
}

type SaveUserPreferencesPayload {
  user: User!
}

type StudentWorkspace {
  user: User!
  roles: [UserRole!]!
}

type StudentPlacement { targetLanguage: String!, curriculumLevel: CurriculumLevel! }
input SetStudentPlacementInput { targetLanguage: String!, curriculumLevel: CurriculumLevel! }
input ClassSessionDiscoveryInput {
  targetLanguage: String!
  curriculumLevel: CurriculumLevel
  teacherUserId: ID
  topicKeys: [String!] = []
  localDate: String
  after: String
}
type ClassSessionDiscoveryFilter {
  targetLanguage: String!
  curriculumLevel: CurriculumLevel
  teacherUserId: ID
  topicKeys: [String!]!
  localDate: String
}
type DiscoveryLessonUnit {
  id: ID!
  title: String!
  summary: String!
  objectives: [String!]!
  topics: [Topic!]!
}
type DiscoverableClassSession {
  id: ID!
  startsAt: String!
  endsAt: String!
  schedulingTimeZone: String!
  seatCapacity: Int!
  occupiedSeats: Int!
  lessonUnit: DiscoveryLessonUnit!
  teacherProfile: PublicTeacherProfile!
}
type ClassSessionDiscoveryPageInfo { endCursor: String, hasNextPage: Boolean! }
type ClassSessionDiscoveryConnection {
  appliedFilter: ClassSessionDiscoveryFilter!
  nodes: [DiscoverableClassSession!]!
  pageInfo: ClassSessionDiscoveryPageInfo!
}
type ClassSessionDiscoveryTeacherOption { id: ID!, displayName: String! }
type ClassSessionDiscoveryOptions {
  targetLanguages: [String!]!
  topics: [Topic!]!
  teachers: [ClassSessionDiscoveryTeacherOption!]!
}

type RolePlace {
  role: UserRole!
  place: WorkspacePlace!
}

type RoleWorkspace {
  actingRole: UserRole!
  relationshipScope: WorkspaceRelationshipScope!
  user: User!
  rolePlaces: [RolePlace!]!
}

type InAppNotification {
  id: ID!
  messageId: String!
  renderedContent: String!
  readAt: String
  archivedAt: String
  createdAt: String!
}

enum NotificationChannel { IN_APP EMAIL }
enum AdministratorTaskKind { NOTIFICATION_DELIVERY_RECONCILIATION }
enum AdministratorTaskState { OPEN RESOLVED }

type AdministratorTaskSafeContext {
  channel: NotificationChannel!
  messageId: String!
  recipientReference: ID!
}

type AdministratorTaskItem {
  id: ID!
  requiredRole: UserRole!
  kind: AdministratorTaskKind!
  state: AdministratorTaskState!
  correlationReference: String!
  safeContext: AdministratorTaskSafeContext!
  createdAt: String!
  resolvedAt: String
}

input ResolveAdministratorTaskInput {
  idempotencyKey: String!
  taskId: ID!
  reason: String!
}

type ResolveAdministratorTaskSuccess { task: AdministratorTaskItem! }
type AdministratorTaskError { code: String! message: String! }
union ResolveAdministratorTaskResult = ResolveAdministratorTaskSuccess | AdministratorTaskError

type Query {
  notifications: [InAppNotification!]!
  administratorTasks: [AdministratorTaskItem!]!
  studentSubscription: Subscription
  studentPlacements: [StudentPlacement!]!
  classSessionDiscoveryOptions: ClassSessionDiscoveryOptions!
  discoverClassSessions(input: ClassSessionDiscoveryInput!): ClassSessionDiscoveryConnection!
  studentClassCredits: ClassCreditAccount!
  studentBookings: [Booking!]!
  studentWaitlistEntries: [WaitlistEntry!]!
  administrationClassCredits(studentUserId: ID!): ClassCreditAccount
  administrationClassSessions: [ClassSession!]!
  teacherClassSessions: [ClassSession!]!
  teacherAbsenceRequests: [AbsenceRequest!]!
  administrationAbsenceRequests: [AbsenceRequest!]!
  teacherAvailability: TeacherAvailability!
  teacherAvailabilityPreview(localDates: [String!]!): [TeacherAvailabilityOccurrence!]!
  administrationCurriculum(locale: InterfaceLocale!): AdministrationCurriculum!
  publicTeacherProfile(teacherUserId: ID!, locale: InterfaceLocale!): PublicTeacherProfile
  roleWorkspace(actingRole: UserRole!): RoleWorkspace!
  studentWorkspace: StudentWorkspace!
}

type Mutation {
  markNotificationRead(id: ID!): InAppNotification!
  archiveNotification(id: ID!): InAppNotification!
  resolveAdministratorTask(input: ResolveAdministratorTaskInput!): ResolveAdministratorTaskResult!
  processSubscriptionProviderEvent(input: ProcessSubscriptionProviderEventInput!): ProcessSubscriptionProviderEventResult!
  scheduleSubscriptionCancellation(input: SubscriptionLifecycleInput!): ScheduleSubscriptionCancellationResult!
  undoSubscriptionCancellation(input: SubscriptionLifecycleInput!): UndoSubscriptionCancellationResult!
  setStudentPlacement(input: SetStudentPlacementInput!): StudentPlacement!
  adjustClassCredits(input: AdjustClassCreditsInput!): AdjustClassCreditsResult!
  bookClassSession(input: BookClassSessionInput!): BookClassSessionResult!
  cancelBooking(input: CancelBookingInput!): CancelBookingResult!
  rescheduleBooking(input: RescheduleBookingInput!): RescheduleBookingResult!
  joinWaitlist(input: JoinWaitlistInput!): JoinWaitlistResult!
  withdrawWaitlist(input: WithdrawWaitlistInput!): WithdrawWaitlistResult!
  publishClassSession(input: PublishClassSessionInput!): PublishClassSessionResult!
  changeClassSessionSeatCapacity(input: ChangeClassSessionSeatCapacityInput!): ChangeClassSessionSeatCapacityResult!
  reportAbsence(input: ReportAbsenceInput!): ReportAbsenceResult!
  substituteTeacher(input: SubstituteTeacherInput!): SubstituteTeacherResult!
  cancelClassSession(input: CancelClassSessionInput!): CancelClassSessionResult!
  saveTeacherAvailabilityRange(input: SaveTeacherAvailabilityRangeInput!): SaveTeacherAvailabilityRangeResult!
  addAvailabilityException(input: AddAvailabilityExceptionInput!): AddAvailabilityExceptionResult!
  endTeacherAvailabilityRange(input: EndTeacherAvailabilityRangeInput!): EndTeacherAvailabilityRangeResult!
  removeAvailabilityException(input: RemoveAvailabilityExceptionInput!): RemoveAvailabilityExceptionResult!
  createCourse(input: CreateCourseInput!): CreateCourseResult!
  reviseCourseDetails(input: UpdateCourseInput!): UpdateCourseResult!
  createLessonUnit(input: CreateLessonUnitInput!): CreateLessonUnitResult!
  reviseLessonUnitIdentity(input: UpdateLessonUnitInput!): UpdateLessonUnitResult!
  placeLessonUnitInCourse(input: ReorderLessonUnitInput!): ReorderLessonUnitResult!
  retireLessonUnit(input: RetireLessonUnitInput!): RetireLessonUnitResult!
  saveLocalizedTopic(input: UpsertTopicInput!): UpsertTopicSuccess!
  addLessonMaterial(input: AddLessonMaterialInput!): AddLessonMaterialResult!
  reviseLessonMaterial(input: ReviseLessonMaterialInput!): ReviseLessonMaterialResult!
  saveTeacherProfile(input: SaveTeacherProfileInput!): SaveTeacherProfileSuccess!
  grantTeacherQualification(input: ChangeTeacherQualificationInput!): GrantTeacherQualificationResult!
  removeTeacherQualification(input: ChangeTeacherQualificationInput!): RemoveTeacherQualificationResult!
  rememberRoleWorkspacePlace(input: RememberRoleWorkspacePlaceInput!): RolePlace!
  saveUserPreferences(input: SaveUserPreferencesInput!): SaveUserPreferencesPayload!
}
