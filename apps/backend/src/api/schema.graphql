enum InterfaceLocale {
  EN
  ES
}

enum UserRole {
  STUDENT
  TEACHER
  ORGANIZATION_MANAGER
  PLATFORM_ADMINISTRATOR
}

enum WorkspacePlace {
  STUDENT_DISCOVERY
  STUDENT_LEARNING
  TEACHER_SCHEDULE
  TEACHER_AVAILABILITY
  ORGANIZATION_STUDENTS
  ORGANIZATION_REPORTS
  ADMINISTRATION_OPERATIONS
  ADMINISTRATION_PEOPLE
}

enum WorkspaceRelationshipScope {
  SELF
  ASSIGNED_CLASS_SESSIONS
  ASSIGNED_ORGANIZATION
  MARKETPLACE_WIDE
}

enum CurriculumLevel { A1 A2 B1 B2 C1 C2 }
enum LessonUnitState { ACTIVE RETIRED }
enum LessonMaterialKind { STRUCTURED_TEXT HTTPS_REFERENCE }
enum Weekday { MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY SUNDAY }
enum LocalTimeDisambiguation { REJECT EARLIER LATER }

type TeacherAvailabilityRange { id: ID!, weekday: Weekday!, startLocalTime: String!, endLocalTime: String!, effectiveFrom: String!, effectiveUntil: String, timeZone: String! }
type AvailabilityException { id: ID!, startsAtLocal: String!, endsAtLocal: String!, startsAt: String!, endsAt: String!, timeZone: String! }
type TeacherAvailability { timeZone: String!, weeklyRanges: [TeacherAvailabilityRange!]!, exceptions: [AvailabilityException!]! }
type TeacherAvailabilityOccurrence { rangeId: ID!, localDate: String!, startLocalTime: String!, endLocalTime: String!, startsAt: String!, endsAt: String! }
input SaveTeacherAvailabilityRangeInput { idempotencyKey: ID!, weekday: Weekday!, startLocalTime: String!, endLocalTime: String!, effectiveFrom: String!, timeZone: String! }
input AddAvailabilityExceptionInput { idempotencyKey: ID!, startsAtLocal: String!, endsAtLocal: String!, startDisambiguation: LocalTimeDisambiguation!, endDisambiguation: LocalTimeDisambiguation! }
input EndTeacherAvailabilityRangeInput { idempotencyKey: ID!, rangeId: ID!, effectiveUntil: String! }
input RemoveAvailabilityExceptionInput { idempotencyKey: ID!, exceptionId: ID! }
type SaveTeacherAvailabilityRangeSuccess { range: TeacherAvailabilityRange! }
type AddAvailabilityExceptionSuccess { exception: AvailabilityException! }
type EndTeacherAvailabilityRangeSuccess { range: TeacherAvailabilityRange! }
type RemoveAvailabilityExceptionSuccess { exceptionId: ID! }
type TeacherAvailabilityValidationError { code: String!, message: String! }
type AvailabilityExceptionSessionConflict { code: String!, message: String!, classSessionIds: [ID!]!, absenceRequestPath: String! }
union SaveTeacherAvailabilityRangeResult = SaveTeacherAvailabilityRangeSuccess | TeacherAvailabilityValidationError
union AddAvailabilityExceptionResult = AddAvailabilityExceptionSuccess | TeacherAvailabilityValidationError | AvailabilityExceptionSessionConflict
union EndTeacherAvailabilityRangeResult = EndTeacherAvailabilityRangeSuccess | TeacherAvailabilityValidationError
union RemoveAvailabilityExceptionResult = RemoveAvailabilityExceptionSuccess | TeacherAvailabilityValidationError

type Topic { key: String!, label: String!, labelEn: String!, labelEs: String! }
type Course { id: ID!, key: String!, targetLanguage: String!, curriculumLevel: CurriculumLevel!, title: String!, summary: String!, lessonUnits: [LessonUnit!]! }
type LessonUnit { id: ID!, key: String!, courseId: ID!, title: String!, summary: String!, objectives: [String!]!, order: Int!, state: LessonUnitState!, topics: [Topic!]!, materials: [LessonMaterial!]! }
type LessonMaterial { id: ID!, kind: LessonMaterialKind!, title: String!, structuredContent: String, httpsUrl: String, publisher: String }
type TeacherQualification { targetLanguage: String!, curriculumLevel: CurriculumLevel! }
type PublicTeacherProfile { id: ID!, displayName: String!, pronouns: String, profileImageUrl: String, professionalBiography: String!, taughtLanguages: [String!]!, qualifiedCurriculumLevels: [CurriculumLevel!]!, teachingTopics: [Topic!]!, completedSessionCount: Int! }
type AdministrationCurriculum { courses: [Course!]!, topics: [Topic!]!, teachers: [PublicTeacherProfile!]! }

input CreateCourseInput { idempotencyKey: ID!, targetLanguage: String!, curriculumLevel: CurriculumLevel!, title: String!, summary: String! }
input UpdateCourseInput { courseId: ID!, title: String!, summary: String! }
input CreateLessonUnitInput { idempotencyKey: ID!, courseId: ID!, title: String!, summary: String!, objectives: [String!]!, topicKeys: [String!]! }
input UpdateLessonUnitInput { lessonUnitId: ID!, title: String!, summary: String!, objectives: [String!]!, topicKeys: [String!]! }
input ReorderLessonUnitInput { lessonUnitId: ID!, order: Int! }
input RetireLessonUnitInput { idempotencyKey: ID!, lessonUnitId: ID!, replacementLessonUnitId: ID }
input UpsertTopicInput { idempotencyKey: ID!, key: String!, labelEn: String!, labelEs: String! }
input StructuredTextBlockInput { type: String!, text: String, items: [String!], level: Int }
input AddLessonMaterialInput { idempotencyKey: ID!, lessonUnitId: ID!, kind: LessonMaterialKind!, title: String!, structuredContent: [StructuredTextBlockInput!], httpsUrl: String, publisher: String }
input ReviseLessonMaterialInput { idempotencyKey: ID!, materialId: ID!, kind: LessonMaterialKind!, title: String!, structuredContent: [StructuredTextBlockInput!], httpsUrl: String, publisher: String }
input SaveTeacherProfileInput { idempotencyKey: ID!, teacherUserId: ID!, pronouns: String, profileImageUrl: String, professionalBiography: String!, topicKeys: [String!]! }
input ChangeTeacherQualificationInput { idempotencyKey: ID!, teacherUserId: ID!, targetLanguage: String!, curriculumLevel: CurriculumLevel! }

type CurriculumConflict { code: String!, message: String! }
type InvalidLessonMaterial { code: String!, message: String! }
type InstructionalIdentityLocked { code: String!, lessonUnitId: ID! }
type TeacherQualificationRemovalBlocked { code: String!, classSessionIds: [ID!]! }
type CreateCourseSuccess { course: Course! }
type UpdateCourseSuccess { course: Course! }
type CreateLessonUnitSuccess { lessonUnit: LessonUnit! }
type UpdateLessonUnitSuccess { lessonUnit: LessonUnit! }
type ReorderLessonUnitSuccess { lessonUnit: LessonUnit! }
type RetireLessonUnitSuccess { lessonUnit: LessonUnit! }
type UpsertTopicSuccess { topic: Topic! }
type AddLessonMaterialSuccess { material: LessonMaterial! }
type ReviseLessonMaterialSuccess { material: LessonMaterial! }
type SaveTeacherProfileSuccess { teacherProfile: PublicTeacherProfile! }
type ChangeTeacherQualificationSuccess { teacherProfile: PublicTeacherProfile! }
union CreateCourseResult = CreateCourseSuccess | CurriculumConflict
union UpdateCourseResult = UpdateCourseSuccess | CurriculumConflict
union CreateLessonUnitResult = CreateLessonUnitSuccess | CurriculumConflict
union UpdateLessonUnitResult = UpdateLessonUnitSuccess | InstructionalIdentityLocked | CurriculumConflict
union ReorderLessonUnitResult = ReorderLessonUnitSuccess | CurriculumConflict
union RetireLessonUnitResult = RetireLessonUnitSuccess | CurriculumConflict
union AddLessonMaterialResult = AddLessonMaterialSuccess | InvalidLessonMaterial | CurriculumConflict
union ReviseLessonMaterialResult = ReviseLessonMaterialSuccess | InvalidLessonMaterial | CurriculumConflict
union GrantTeacherQualificationResult = ChangeTeacherQualificationSuccess | CurriculumConflict
union RemoveTeacherQualificationResult = ChangeTeacherQualificationSuccess | TeacherQualificationRemovalBlocked | CurriculumConflict

type User {
  id: ID!
  displayName: String!
  interfaceLocale: InterfaceLocale
  displayTimeZone: String
}

input SaveUserPreferencesInput {
  actingRole: UserRole!
  interfaceLocale: InterfaceLocale!
  displayTimeZone: String!
}

input RememberRoleWorkspacePlaceInput {
  actingRole: UserRole!
  place: WorkspacePlace!
}

type SaveUserPreferencesPayload {
  user: User!
}

type StudentWorkspace {
  user: User!
  roles: [UserRole!]!
}

type RolePlace {
  role: UserRole!
  place: WorkspacePlace!
}

type RoleWorkspace {
  actingRole: UserRole!
  relationshipScope: WorkspaceRelationshipScope!
  user: User!
  rolePlaces: [RolePlace!]!
}

type Query {
  teacherAvailability: TeacherAvailability!
  teacherAvailabilityPreview(localDates: [String!]!): [TeacherAvailabilityOccurrence!]!
  administrationCurriculum(locale: InterfaceLocale!): AdministrationCurriculum!
  publicTeacherProfile(teacherUserId: ID!, locale: InterfaceLocale!): PublicTeacherProfile
  roleWorkspace(actingRole: UserRole!): RoleWorkspace!
  studentWorkspace: StudentWorkspace!
}

type Mutation {
  saveTeacherAvailabilityRange(input: SaveTeacherAvailabilityRangeInput!): SaveTeacherAvailabilityRangeResult!
  addAvailabilityException(input: AddAvailabilityExceptionInput!): AddAvailabilityExceptionResult!
  endTeacherAvailabilityRange(input: EndTeacherAvailabilityRangeInput!): EndTeacherAvailabilityRangeResult!
  removeAvailabilityException(input: RemoveAvailabilityExceptionInput!): RemoveAvailabilityExceptionResult!
  createCourse(input: CreateCourseInput!): CreateCourseResult!
  reviseCourseDetails(input: UpdateCourseInput!): UpdateCourseResult!
  createLessonUnit(input: CreateLessonUnitInput!): CreateLessonUnitResult!
  reviseLessonUnitIdentity(input: UpdateLessonUnitInput!): UpdateLessonUnitResult!
  placeLessonUnitInCourse(input: ReorderLessonUnitInput!): ReorderLessonUnitResult!
  retireLessonUnit(input: RetireLessonUnitInput!): RetireLessonUnitResult!
  saveLocalizedTopic(input: UpsertTopicInput!): UpsertTopicSuccess!
  addLessonMaterial(input: AddLessonMaterialInput!): AddLessonMaterialResult!
  reviseLessonMaterial(input: ReviseLessonMaterialInput!): ReviseLessonMaterialResult!
  saveTeacherProfile(input: SaveTeacherProfileInput!): SaveTeacherProfileSuccess!
  grantTeacherQualification(input: ChangeTeacherQualificationInput!): GrantTeacherQualificationResult!
  removeTeacherQualification(input: ChangeTeacherQualificationInput!): RemoveTeacherQualificationResult!
  rememberRoleWorkspacePlace(input: RememberRoleWorkspacePlaceInput!): RolePlace!
  saveUserPreferences(input: SaveUserPreferencesInput!): SaveUserPreferencesPayload!
}
